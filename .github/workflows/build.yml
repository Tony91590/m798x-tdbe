name: Build ImmortalWrt

on:
  push:
    tags:
      - v**
  workflow_dispatch:
    inputs:
      build_config:
        description: Firmware config to build
        required: true
        type: choice
        default: full
        options:
          - full
          - mini
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"config_name":"full","config_file":"full"}]' || inputs.build_config == 'mini' && '[{"config_name":"mini","config_file":"minimal"}]' || inputs.build_config == 'both' && '[{"config_name":"mini","config_file":"minimal"},{"config_name":"full","config_file":"full"}]' || '[{"config_name":"full","config_file":"full"}]') }}

    env:
      DEBIAN_FRONTEND: noninteractive
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: "3000M"
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
      - name: Checkout My Repository Source
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Restore Download Cache
        uses: actions/cache@v6.1.0
        with:
          path: dl
          key: ${{ runner.os }}-immortalwrt-dl-${{ matrix.config_name }}-${{ hashFiles(format('defconfig/{0}.config', matrix.config_file)) }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-dl-${{ matrix.config_name }}-
            ${{ runner.os }}-immortalwrt-dl-

      - name: Restore Compiler Cache
        id: ccache-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: .ccache
          key: ${{ runner.os }}-immortalwrt-ccache-${{ matrix.config_name }}-${{ github.ref_name }}-${{ hashFiles(format('defconfig/{0}.config', matrix.config_file)) }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-ccache-${{ matrix.config_name }}-${{ github.ref_name }}-${{ hashFiles(format('defconfig/{0}.config', matrix.config_file)) }}-
            ${{ runner.os }}-immortalwrt-ccache-${{ matrix.config_name }}-
            ${{ runner.os }}-immortalwrt-ccache-

      - name: Restore Host/Toolchain Cache
        id: host-toolchain-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            staging_dir/host
            staging_dir/hostpkg
            staging_dir/toolchain-*
            build_dir/host
            build_dir/hostpkg
            build_dir/toolchain-*
          key: ${{ runner.os }}-immortalwrt-host-toolchain-${{ matrix.config_name }}-${{ github.ref_name }}-${{ hashFiles('tools/**', 'toolchain/**', 'include/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-host-toolchain-${{ matrix.config_name }}-${{ github.ref_name }}-${{ hashFiles('tools/**', 'toolchain/**', 'include/**') }}-
            ${{ runner.os }}-immortalwrt-host-toolchain-${{ matrix.config_name }}-
            ${{ runner.os }}-immortalwrt-host-toolchain-

      - name: Initialize Build Environment
        run: |
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Prepare Compiler Cache
        run: |
          set -euo pipefail

          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi

          mkdir -p "${CCACHE_DIR}" dl
          ccache -M "${CCACHE_MAXSIZE}"
          ccache --zero-stats || true
          ccache --show-config | sed -n '1,20p'

      - name: Update and Install Feeds
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply OpenWrt Patches
        run: |
         set -euo pipefail

          PATCH_FILE="patches/diff.patch"
          FILE="package/network/config/netifd/files/sbin/ifdown"

         if [ ! -f "$PATCH_FILE" ]; then
          echo "::error::Patch file not found: $PATCH_FILE"
          exit 1
         fi

             patch --dry-run -p1 < "$PATCH_FILE"
             patch -p1 < "$PATCH_FILE"

             find . -type f -name '*.orig' -delete

             if [ ! -f "$(dirname "$FILE")/ifup" ]; then
               echo "::error::ifup file not found"
               exit 1
             fi

             rm -f "$FILE"
             ln -s ifup "$FILE"

             test -L "$FILE"
             test "$(readlink "$FILE")" = "ifup"

             echo "ifdown successfully linked to ifup"

      - name: Load Configuration (${{ matrix.config_name }})
        run: |
          CONFIG_FILE="defconfig/${{ matrix.config_file }}.config"

          set_config() {
            local key="$1"
            local value="$2"

            if grep -q "^# ${key} is not set$" .config; then
              sed -i "s|^# ${key} is not set$|${key}=${value}|" .config
            elif grep -q "^${key}=" .config; then
              sed -i "s|^${key}=.*$|${key}=${value}|" .config
            else
              echo "${key}=${value}" >> .config
            fi
          }

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Config file not found: $CONFIG_FILE"
            exit 1
          fi

          cp -f "$CONFIG_FILE" .config
          echo "Successfully loaded $CONFIG_FILE"

          set_config "CONFIG_CCACHE" "y"

          make defconfig

          echo "Key config:"
          grep -E '^(CONFIG_TARGET_|CONFIG_CCACHE=|CONFIG_PACKAGE_luci-app-ttyd=|CONFIG_PACKAGE_ttyd=)' .config || true

      - name: Download Sources
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -delete

      - name: Compile Firmware
        run: |
          set -euo pipefail

          ccache --show-stats || true

          if ! make -j"$(nproc)"; then
            echo "::warning::Parallel build failed, retrying with -j1 V=s"
            make -j1 V=s
          fi

          ccache --show-stats || true

      - name: Save Compiler Cache
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Save Host/Toolchain Cache
        if: success() && steps.host-toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            staging_dir/host
            staging_dir/hostpkg
            staging_dir/toolchain-*
            build_dir/host
            build_dir/hostpkg
            build_dir/toolchain-*
          key: ${{ steps.host-toolchain-cache.outputs.cache-primary-key }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: firmware-${{ matrix.config_name }}
          path: bin/targets/mediatek/filogic/*.bin

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: all-firmwares

      - name: Flatten and Rename Files
        run: |
          mkdir -p final-release
          for config_dir in all-firmwares/*/; do
            config_name=$(basename "$config_dir")
            for bin_file in "$config_dir"*.bin; do
              if [ -f "$bin_file" ]; then
                base=$(basename "$bin_file")
                cp "$bin_file" "final-release/${base%.bin}-${config_name}.bin"
              fi
            done
          done

      - name: Create Unified Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          make_latest: true
          tag_name: ${{ github.ref_name }}
          files: final-release/*.bin
          draft: true
          body: |
            ## Release Notes

            ### Build Configuration
            - Tags build the full firmware by default.
            - Mini is available through manual workflow_dispatch.
            - Full includes the following additional packages:
              - luci-proto-wireguard
              - luci-app-wol
              - luci-i18n-wol-zh-cn
              - ddns-scripts-cloudflare
              - luci-app-ddns
              - luci-i18n-ddns-zh-cn
              - bind-host
              - luci-app-store
              - kmod-tun
              - kmod-iptunnel
              - kmod-wireguard
              - luci-app-ttyd
              - ttyd
