
name: Build ImmortalWrt

on:
  push:
    tags:
      - 'v**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ubuntu:20.04

    strategy:
      matrix:
        include:
          - config_name: tenda-be12-pro
            config_file: tenda-be12-pro

    env:
      DEBIAN_FRONTEND: noninteractive
      FORCE_UNSAFE_CONFIGURE: 1
      TZ: Europe/Paris

    steps:
      # ==========================================
      # CHECKOUT SOURCE
      # ==========================================
      - name: Checkout My Repository Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # ==========================================
      # INITIALIZE BUILD ENVIRONMENT
      # ==========================================
      - name: Initialize Build Environment
        shell: bash
        run: |
          set -e

          ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          echo "$TZ" > /etc/timezone

          apt-get update -y
          apt-get full-upgrade -y

          apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang clangd \
            cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gperf haveged help2man \
            intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5 libncursesw5-dev libreadline-dev \
            libssl-dev libtool lld lldb lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python2.7 \
            python3 python3-pip python3-ply python3-docutils qemu-utils \
            re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev \
            ca-certificates file perl python3-setuptools python3-yaml \
            time xsltproc zstd

          mkdir -p /workdir
          chmod 777 /workdir

          echo "===== UBUNTU VERSION ====="
          cat /etc/os-release

          echo "===== CPU ====="
          nproc

          echo "===== DISK ====="
          df -hT

          echo "===== GIT VERSION ====="
          git --version

      # ==========================================
      # FIX AND VERIFY GIT REVISION
      # ==========================================
      - name: Fix Git Revision
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          echo "===== GIT INFORMATION ====="

          echo "Repository:"
          git rev-parse --show-toplevel

          echo "Commit:"
          git rev-parse HEAD

          echo "Branch:"
          git branch --show-current || true

          echo "Tags:"
          git tag --list | tail -20

          echo "Description:"
          git describe --tags --always || true

          echo "===== IMMORTALWRT VERSION ====="

          REVISION="$(./scripts/getver.sh)"
          echo "Detected revision: $REVISION"

          if [ -z "$REVISION" ] || [ "$REVISION" = "unknown" ]; then
            echo "::error::ImmortalWrt Git revision is unknown!"
            exit 1
          fi

          echo "===== VERSION CHECK SUCCESSFUL ====="

      # ==========================================
      # UPDATE AND INSTALL FEEDS
      # ==========================================
      - name: Update and Install Feeds
        shell: bash
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ==========================================
      # LOAD CONFIGURATION
      # ==========================================
      - name: Load Configuration (${{ matrix.config_name }})
        shell: bash
        run: |
          set -e

          CONFIG_FILE="defconfig/${{ matrix.config_file }}.config"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error::Config file not found: $CONFIG_FILE"
            exit 1
          fi

          cp -f "$CONFIG_FILE" .config

          echo "Successfully loaded $CONFIG_FILE"

          make defconfig

          echo "===== KEY CONFIGURATION ====="

          grep -E \
            '^(CONFIG_TARGET_|CONFIG_PACKAGE_luci-app-passwall=|CONFIG_PACKAGE_luci-app-ttyd=|CONFIG_PACKAGE_ttyd=)' \
            .config || true

      # ==========================================
      # DOWNLOAD SOURCES
      # ==========================================
      - name: Download Sources
        shell: bash
        run: |
          set -e

          make download -j"$(nproc)"

          find dl -type f -size -1024c -delete

      # ==========================================
      # COMPILE FIRMWARE
      # ==========================================
      - name: Compile
        shell: bash
        run: |
          set -euo pipefail

          echo "===== START COMPILATION ====="

          if ! make -j"$(nproc)"; then
            echo "::warning::Parallel build failed, retrying with -j1 V=s"
            make -j1 V=s
          fi

          echo "===== COMPILATION FINISHED ====="

      # ==========================================
      # UPLOAD FIRMWARE
      # ==========================================
      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ matrix.config_name }}
          path: bin/targets/mediatek/filogic/*.bin
          if-no-files-found: error

  # ==========================================
  # PUBLISH RELEASE
  # ==========================================
  publish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}

    steps:
      # ==========================================
      # DOWNLOAD ARTIFACTS
      # ==========================================
      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: all-firmwares

      # ==========================================
      # FLATTEN AND RENAME FILES
      # ==========================================
      - name: Flatten and Rename Files
        shell: bash
        run: |
          set -e

          mkdir -p final-release

          for config_dir in all-firmwares/*/; do
            config_name=$(basename "$config_dir")

            for bin_file in "$config_dir"*.bin; do
              if [ -f "$bin_file" ]; then
                base=$(basename "$bin_file")

                cp "$bin_file" \
                  "final-release/${base%.bin}-${config_name}.bin"
              fi
            done
          done

          echo "===== RELEASE FILES ====="
          ls -lh final-release/

      # ==========================================
      # CREATE GITHUB RELEASE
      # ==========================================
      - name: Create Unified Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          tag_name: ${{ github.ref_name }}
          files: final-release/*.bin
          draft: true
          body: |
            ## 📦 Release Notes

            ### ✨ Build Configurations

            - `luci-proto-wireguard`: WireGuard VPN protocol support
            - `wireguard-tools`: WireGuard management tools
            - `luci-app-wol`: Wake-on-LAN (WoL) interface
            - `ddns-scripts-cloudflare`: Cloudflare DDNS scripts
            - `ddns-scripts-services`: DDNS service support
            - `luci-app-ddns`: Dynamic DNS configuration interface
            - `bind-host`: BIND DNS lookup utility
            - `luci-app-upnp`: UPnP configuration interface
            - `miniupnpd-nftables`: UPnP / NAT-PMP service
            - `luci-app-firewall`: Firewall configuration interface
            - `luci-app-ttyd` / `ttyd`: Web-based terminal
            - `luci-app-eqos-mtk`: MediaTek QoS traffic management
            - `luci-app-turboacc-mtk`: MediaTek network acceleration management
            - `luci-app-mtwifi-cfg`: MediaTek Wi-Fi configuration interface
            - `kmod-wireguard`: WireGuard kernel module
            - `kmod-tun`: TUN virtual network device support
            - `htop`: System resource monitor
            - `etherwake`: Wake-on-LAN utility
